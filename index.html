<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nazarbayev University - My Account</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #333;
    }

    /* Верхняя коричневая полоса */
    .top-bar {
      height: 25px;
      background-color: #8C6239;
    }

    /* Шапка с логотипами */
    .header {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px 10px;
      gap: 15px;
      background-color: #fff;
    }

    .header-logo {
      height: 45px;
      object-fit: contain;
    }

    .divider {
      width: 1px;
      height: 40px;
      background-color: #d1d1d1;
    }

    /* Выпадающее имя */
    .user-dropdown-container {
      display: flex;
      justify-content: center;
      margin: 10px 0 15px;
    }

    .user-dropdown {
      border: 1px solid #237A8B;
      padding: 8px 16px;
      border-radius: 2px;
      font-size: 15px;
      color: #333;
      background-color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dropdown-arrow {
      border: solid #237A8B;
      border-width: 0 2px 2px 0;
      display: inline-block;
      padding: 3px;
      transform: rotate(45deg);
      margin-bottom: 3px;
    }

    /* Кнопка Log Out */
    .logout-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
      margin-bottom: 20px;
      color: #237A8B;
      font-size: 15px;
      cursor: pointer;
    }

    .power-icon {
      width: 16px;
      height: 16px;
      border: 2px solid #237A8B;
      border-radius: 50%;
      border-top-color: transparent;
      position: relative;
      display: inline-block;
    }

    .power-icon::after {
      content: '';
      position: absolute;
      top: -2px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 8px;
      background-color: #237A8B;
    }

    /* Декоративный паттерн */
    .pattern-bar {
      height: 12px;
      background-image: radial-gradient(#e0e0e0 2px, transparent 2px);
      background-size: 12px 12px;
      background-color: #f9f9f9;
      border-top: 1px solid #eaeaea;
      border-bottom: 1px solid #eaeaea;
    }

    /* Меню */
    .menu-bar {
      background-color: #237A8B;
      color: white;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 500;
    }

    .hamburger-icon {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 20px;
    }

    .hamburger-icon span {
      display: block;
      height: 3px;
      background-color: white;
      border-radius: 2px;
    }

    /* Хлебные крошки */
    .breadcrumb {
      padding: 15px;
      font-size: 15px;
      color: #333;
    }

    /* Карточка профиля */
    .profile-card {
      background-color: #0B486B;
      color: white;
      text-align: center;
      padding: 25px 20px;
      margin: 0 15px 20px;
    }

    .user-name {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .user-id {
      color: #4DB6AC;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .avatar-container {
      width: 110px;
      height: 140px;
      margin: 0 auto 15px;
      background-color: #fff;
      padding: 3px;
    }

    .avatar-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .agreements {
      font-size: 13px;
      color: #B2DFDB;
      line-height: 1.4;
    }

    .agreements div {
      margin-top: 3px;
    }

    /* Вкладки Make a payment / My payments */
    .tabs-container {
      margin: 0 15px;
      display: flex;
      border: 1px solid #d1d1d1;
    }

    .tab {
      flex: 1;
      padding: 12px 5px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .tab.active {
      background-color: #237A8B;
      color: white;
    }

    .tab.inactive {
      background-color: #fff;
      color: #555;
    }

    /* Блоки разделов (Sports, Other, Dormitory) */
    .section-list {
      margin: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .section-card {
      border: 1px solid #e0e0e0;
      padding: 20px;
      background-color: #fff;
      position: relative;
    }

    .section-title {
      font-size: 18px;
      font-weight: 500;
      color: #333;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .section-line {
      width: 40px;
      height: 3px;
      background-color: #237A8B;
      margin-bottom: 15px;
    }

    .info-circle {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 22px;
      height: 22px;
      border: 1px solid #777;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #555;
    }

    .section-links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .section-links a {
      color: #237A8B;
      text-decoration: none;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <!-- Верхняя полоса -->
  <div class="top-bar"></div>

  <!-- Шапка с логотипом (Замените logo.png на путь к вашему логотипу) -->
  <div class="header">
    <img src="logo.png" alt="Nazarbayev University" class="header-logo" onerror="this.src='https://via.placeholder.com/150x45?text=NU+Logo'">
    <div class="divider"></div>
    <img src="logo.png" alt="Nazarbayev University" class="header-logo" onerror="this.src='https://via.placeholder.com/150x45?text=NU+Logo'">
  </div>

  <!-- Выпадающий список пользователя -->
  <div class="user-dropdown-container">
    <div class="user-dropdown">
      <!-- МЕНЯТЬ ИМЯ ЗДЕСЬ -->
      <span>Yerkebulan Tabyssuly</span>
      <i class="dropdown-arrow"></i>
    </div>
  </div>

  <!-- Кнопка Выхода -->
  <div class="logout-container">
    <span>Log Out</span>
    <span class="power-icon"></span>
  </div>

  <!-- Декоративная полоса -->
  <div class="pattern-bar"></div>

  <!-- Меню -->
  <div class="menu-bar">
    <div class="hamburger-icon">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <span>MENU</span>
  </div>

  <!-- Навигация -->
  <div class="breadcrumb">
    &gt; My account
  </div>

  <!-- Главная карточка студента -->
  <div class="profile-card">
    <!-- МЕНЯТЬ ИМЯ ЗДЕСЬ -->
    <div class="user-name">Yerkebulan Tabyssuly</div>
    
    <!-- МЕНЯТЬ ID ЗДЕСЬ -->
    <div class="user-id">ID:202352557</div>

    <!-- МЕНЯТЬ ФОТО ЗДЕСЬ (Укажите название вашего файла вместо photo.jpg) -->
    <div class="avatar-container">
      <img src="photo.jpg" alt="Student Photo" onerror="this.src='https://via.placeholder.com/110x140?text=Photo'">
    </div>

    <div class="agreements">
      <div>Accession services agreement</div>
      <div>My account using regulation</div>
    </div>
  </div>

  <!-- Переключатель платежей -->
  <div class="tabs-container">
    <div class="tab active">Make a payment</div>
    <div class="tab inactive">My payments</div>
  </div>

  <!-- Разделы с услугами -->
  <div class="section-list">
    
    <!-- SPORTS -->
    <div class="section-card">
      <div class="info-circle">&#8210;</div>
      <div class="section-title">Sports</div>
      <div class="section-line"></div>
      <div class="section-links">
        <a href="#">Multi-visit pass</a>
        <a href="#">All access pass 3m</a>
        <a href="#">All access pass 6m</a>
      </div>
    </div>

    <!-- OTHER -->
    <div class="section-card">
      <div class="info-circle">&#8210;</div>
      <div class="section-title">Other</div>
      <div class="section-line"></div>
      <div class="section-links">
        <a href="#">Recovering ID</a>
        <a href="#">Student fund</a>
      </div>
    </div>

    <!-- DORMITORY -->
    <div class="section-card">
      <div class="info-circle">&#8210;</div>
      <div class="section-title">Dormitory</div>
      <div class="section-line"></div>
      <div class="section-links">
        <a href="#">Dormitory fee</a>
      </div>
    </div>

  </div>

</body>
</html>
