<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal — My Account</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="top-strip"></div>

  <header class="account-header">
    <div class="brand" aria-label="Nazarbayev University">
      <div class="brand-mark">NU</div>
      <div class="brand-name">NAZARBAYEV<br>UNIVERSITY</div>
      <span class="brand-divider"></span>
      <div class="brand-mark small">NU</div>
      <div class="brand-name small-name">NAZARBAYEV<br>UNIVERSITY</div>
    </div>

    <button class="profile-select" id="profileSelect">
      Yerkebulan Tabyssuly <span class="chevron">⌄</span>
    </button>
    <div class="profile-menu" id="profileMenu">
      <button>My account</button>
      <button>Personal information</button>
    </div>
    <button class="logout" id="logoutButton">Log Out <span>⏻</span></button>
    <div class="ornament"></div>
  </header>

  <nav class="menu-bar">
    <button class="menu-toggle" id="menuToggle" aria-label="Open menu"><span>☰</span> MENU</button>
  </nav>
  <div class="side-menu" id="sideMenu">
    <button class="close-menu" id="closeMenu">×</button>
    <a href="#account">My account</a>
    <a href="#payments">Make a payment</a>
    <a href="#payments">My payments</a>
  </div>

  <main>
    <div class="breadcrumb">&gt; My account</div>

    <section class="student-card" id="account">
      <h1>Yerkebulan Tabyssuly</h1>
      <div class="student-id">ID:202352557</div>
      <img class="student-photo" src="assets/student-photo.jpg" alt="Student portrait">
      <div class="card-links">
        <a href="#" data-info="Accession services agreement">Accession services agreement</a>
        <a href="#" data-info="My account using regulation">My account using regulation</a>
      </div>
    </section>

    <section class="payments" id="payments">
      <div class="tabs">
        <button class="tab active" data-tab="make">MAKE A PAYMENT</button>
        <button class="tab" data-tab="history">MY PAYMENTS</button>
      </div>
      <div id="makePanel">
        <section class="category">
          <button class="category-heading" aria-expanded="true">
            <span>SPORTS</span><span class="minus">−</span>
          </button>
          <div class="category-content">
            <button class="service" data-service="Multi-visit pass">Multi-visit pass</button>
            <button class="service" data-service="All access pass 3m">All access pass 3m</button>
            <button class="service" data-service="All access pass 6m">All access pass 6m</button>
          </div>
        </section>
        <section class="category">
          <button class="category-heading" aria-expanded="true">
            <span>OTHER</span><span class="minus">−</span>
          </button>
          <div class="category-content">
            <button class="service" data-service="Recovering ID">Recovering ID</button>
            <button class="service" data-service="Student fund">Student fund</button>
          </div>
        </section>
        <section class="category">
          <button class="category-heading" aria-expanded="true">
            <span>DORMITORY</span><span class="minus">−</span>
          </button>
          <div class="category-content">
            <button class="service" data-service="Dormitory fee">Dormitory fee</button>
          </div>
        </section>
      </div>
      <div id="historyPanel" class="history-panel" hidden>
        <h2>MY PAYMENTS</h2>
        <p>No payments to display.</p>
      </div>
    </section>
  </main>

  <dialog id="serviceDialog">
    <button class="dialog-close" id="dialogClose" aria-label="Close">×</button>
    <h2 id="dialogTitle">Service</h2>
    <p>This is a demonstration of the student portal interface.</p>
    <label for="amount">Amount</label>
    <input id="amount" type="number" min="0" placeholder="Enter amount">
    <button class="confirm-button" id="confirmPayment">Continue</button>
  </dialog>
  <div class="toast" id="toast" role="status"></div>
  <script src="script.js"></script>
</body>
</html>
